<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gruppe 3 - Lydpladsen | Designguide & Inspiration</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>
</head>

<body>

    <main class="container">
        <!-- Top overskrift -->
        <header class="header">
            <h1>GRUPPE 3 - LYDPLADSEN</h1>
        </header>

        <!-- Mørkt banner -->
        <section class="banner banner-dark">
            <img src="Lydpladsen hvidt.png" alt="Lydpladsen logo hvidt" class="wordmark-img">
            <img src="Logo hvidt.png" alt="Lydpladsen app ikon hvidt" class="icon-img">
        </section>

        <!-- Lyst banner -->
        <section class="banner banner-light">
            <img src="Lydpladsen mørkt.png" alt="Lydpladsen logo mørkt" class="wordmark-img">
            <video autoplay muted loop playsinline class="icon-img">
                <source src="Batteri opladnings animation.mp4">
            </video>
        </section>

        <!-- Typografi & 3D sektion -->
    <section class="typography">
        <p class="font-sample font-roskilde">ROSKILDE 4000</p>

        <div class="logo-and-3d-row">

            <div class="green-logo-wrapper">
                <img
                    src="Logo grønt.png"
                    alt="Lydpladsen grønt ikon"
                    class="icon-green-img"
                >
            </div>

            <div class="model-gallery">

                <model-viewer
                    id="mainModel"
                    src="./model1.glb"
                    alt="3D model af tromme"
                    camera-controls
                    auto-rotate
                    camera-orbit="0deg 25deg auto"
                    exposure="1.2"
                    tone-mapping="neutral"
                    shadow-intensity="1"
                    style="background-color: #c7dd8c;">
                </model-viewer>

                <div class="model-navigation">

                <button id="prevModel" aria-label="Previous model">
                    &#10094;
                </button>

                <button id="nextModel" aria-label="Next model">
                    &#10095;
                </button>

            </div>

            </div>

        </div>
    </section>


        <hr class="divider">

        <!-- Inspirations- og stemningssektion -->
        <section class="inspiration-section">
            <div class="inspiration-header">
                <h2> Områder</h2>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">Alle</button>
                    <button class="filter-btn" data-filter="inventar">Inventar & Miljø</button>
                    <button class="filter-btn" data-filter="former">Former & Udtryk</button>
                    <button class="filter-btn" data-filter="opdatering">Opdatering</button>
                </div>
            </div>

            <div class="moodboard-grid">
                <div class="mood-card" data-category="inventar">
                    <img src="Dj booth.jpg" alt="DJ booth">
                    <div class="card-caption">DJ Booth</div>
                </div>
                <div class="mood-card" data-category="inventar">
                    <img src="Containere.jpg" alt="Containere">
                    <div class="card-caption">Containere</div>
                </div>
                <div class="mood-card" data-category="inventar">
                    <img src="Hængekøje.jpg" alt="Hængekøje">
                    <div class="card-caption">Hængekøje</div>
                </div>
                <div class="mood-card" data-category="inventar">
                    <img src="Bænk.jpg" alt="Bænk">
                    <div class="card-caption">Bænk</div>
                </div>
                <div class="mood-card" data-category="inventar">
                    <img src="Bænk 2.jpg" alt="">
                    <div class="card-caption">Armgangsstativ</div>
                </div>
                <div class="mood-card" data-category="former">
                    <img src="Runde forme.jpg" alt="Plads">
                    <div class="card-caption">Plads</div>
                </div>
                <div class="mood-card" data-category="former">
                    <img src="firkandtede forme.jpg" alt="Vand">
                    <div class="card-caption">Vand forme</div>
                </div>
                <div class="mood-card" data-category="opdatering">
                    <img src="Træfagot i gyldent parklys.jpg" alt="Vand">
                    <div class="card-caption">Vand forme</div>
                </div>
                <div class="mood-card" data-category="opdatering">
                    <img src="Musicon legeplads med pianotrapper.jpg" alt="Vand">
                    <div class="card-caption">Vand forme</div>
                </div>
                <div class="mood-card" data-category="opdatering">
                    <img src="Violinlegeplads i gyldent sollys.jpg" alt="Vand">
                    <div class="card-caption">Vand forme</div>
                </div>
                <div class="mood-card" data-category="opdatering">
                    <img src="Genbrugstræ Trommer i Gyldent Parklys.jpg" alt="Vand">
                    <div class="card-caption">Vand forme</div>
                </div>
                <div class="mood-card" data-category="opdatering">
                    <img src="Pianotaster og rampe i solrig park.jpg" alt="Vand">
                    <div class="card-caption">Vand forme</div>
                </div>
                <div class="mood-card" data-category="opdatering">
                    <img src="Musikkarrusel i træ blandt blomsterne.jpg" alt="Vand">
                    <div class="card-caption">Vand forme</div>
                </div>
                <div class="mood-card" data-category="opdatering">
                    <img src="Violinformet træbænk i gyldent parklys.jpg" alt="Vand">
                    <div class="card-caption">Vand forme</div>
                </div>
                <div class="mood-card" data-category="opdatering">
                    <img src="Solcelleparasol med trommeformet underside.jpg" alt="Vand">
                    <div class="card-caption">Vand forme</div>
                </div>
            </div>
        </section>
        <div id="imageLightbox" class="lightbox">
            <button class="lightbox-close" aria-label="Close">&times;</button>

            <img id="lightboxImage" src="" alt="">

            <p id="lightboxCaption"></p>
        </div>
    </main>

</body>

</html>
