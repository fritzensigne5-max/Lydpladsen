<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#c7dd8c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gruppe 3 - Lydpladsen | Designguide & Inspiration</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>
</head>

<body>

    <main class="container">
        <!-- Top overskrift -->
        <header class="header">
            <h1>GRUPPE 3 - LYDPLADSEN</h1>
        </header>

        <!-- Mørkt banner -->
        <section class="banner banner-dark">
            <img src="img/Lydpladsen hvidt.png" alt="Lydpladsen logo hvidt" class="wordmark-img">
            <img src="img/Logo hvidt.png" alt="Lydpladsen app ikon hvidt" class="icon-img">
        </section>

        <!-- Lyst banner -->
        <section class="banner banner-light">
            <img src="img/Lydpladsen mørkt.png" alt="Lydpladsen logo mørkt" class="wordmark-img">
            <video autoplay muted loop playsinline class="icon-img">
                <source src="img/Batteri opladnings animation.mp4">
            </video>
        </section>

        <!-- Typografi & 3D sektion -->
    <section class="typography">
        <p class="font-sample font-roskilde">ROSKILDE 4000</p>

        <div class="logo-and-3d-row">

            <div class="green-logo-wrapper">
                <img
                    src="img/Logo grønt.png"
                    alt="Lydpladsen grønt ikon"
                    class="icon-green-img"
                >
            </div>

            <div class="model-gallery">

                <model-viewer
                    id="mainModel"
                    src="models/model1.glb"
                    alt="3D model af tromme"
                    camera-controls
                    auto-rotate
                    camera-orbit="0deg 25deg auto"
                    exposure="1.2"
                    tone-mapping="neutral"
                    shadow-intensity="1"
                    style="background-color: #c7dd8c;">
                </model-viewer>

                <div class="model-navigation">

                <button id="prevModel" aria-label="Previous model">
                    &#10094;
                </button>

                <button id="nextModel" aria-label="Next model">
                    &#10095;
                </button>

            </div>

            </div>

        </div>
    </section>


        <hr class="divider">

        <!-- Inspirations- og stemningssektion -->
        <section class="inspiration-section">
            <div class="inspiration-header">
                <h2> Områder</h2>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">Alle</button>
                    <button class="filter-btn" data-filter="inventar">Inventar & Miljø</button>
                    <button class="filter-btn" data-filter="former">Former & Udtryk</button>
                    <button class="filter-btn" data-filter="opdatering">Opdatering</button>
                </div>
            </div>

            <div class="moodboard-grid">
                <div class="mood-card" data-category="inventar">
                    <img src="img/Dj booth.jpg" alt="DJ booth">
                    <div class="card-caption">DJ Booth</div>
                </div>
                <div class="mood-card" data-category="inventar">
                    <img src="img/Containere.jpg" alt="Containere">
                    <div class="card-caption">Containere</div>
                </div>
                <div class="mood-card" data-category="inventar">
                    <img src="img/Hængekøje.jpg" alt="Hængekøje">
                    <div class="card-caption">Hængekøje</div>
                </div>
                <div class="mood-card" data-category="inventar">
                    <img src="img/Bænk.jpg" alt="Bænk">
                    <div class="card-caption">Bænk</div>
                </div>
                <div class="mood-card" data-category="inventar">
                    <img src="img/Bænk 2.jpg" alt="">
                    <div class="card-caption">Armgangsstativ</div>
                </div>
                <div class="mood-card" data-category="former">
                    <img src="img/Runde forme.jpg" alt="Plads">
                    <div class="card-caption">Plads</div>
                </div>
                <div class="mood-card" data-category="former">
                    <img src="img/firkandtede forme.jpg" alt="Vand former">
                    <div class="card-caption">Vand former</div>
                </div>
                <div class="mood-card" data-category="opdatering">
                    <img src="img/Træfagot i gyldent parklys.jpg" alt="Træform">
                    <div class="card-caption">Træform</div>
                </div>
                <div class="mood-card" data-category="opdatering">
                    <img src="img/Musicon legeplads med pianotrapper.jpg" alt="Legeplads">
                    <div class="card-caption">Legeplads</div>
                </div>
                <div class="mood-card" data-category="opdatering">
                    <img src="img/Violinlegeplads i gyldent sollys.jpg" alt="Violinvippe">
                    <div class="card-caption">Violinlegevippe</div>
                </div>
                <div class="mood-card" data-category="opdatering">
                    <img src="img/Genbrugstræ Trommer i Gyldent Parklys.jpg" alt="Genbrugstræ">
                    <div class="card-caption">Genbrugstræ Tromme</div>
                </div>
                <div class="mood-card" data-category="opdatering">
                    <img src="img/Pianotaster og rampe i solrig park.jpg" alt="Piano træppe">
                    <div class="card-caption">Piano Træppe</div>
                </div>
                <div class="mood-card" data-category="opdatering">
                    <img src="img/Musikkarrusel i træ blandt blomsterne.jpg" alt="Musikkarrusel">
                    <div class="card-caption">Musikkarrusel</div>
                </div>
                <div class="mood-card" data-category="opdatering">
                    <img src="img/Violinformet træbænk i gyldent parklys.jpg" alt="Træbænk">
                    <div class="card-caption">Træbænk</div>
                </div>
                <div class="mood-card" data-category="opdatering">
                    <img src="img/Solcelleparasol med trommeformet underside.jpg" alt="Solcelleparasol">
                    <div class="card-caption">Solcelleparasol</div>
                </div>
                </div>
            </div>
        </section>
        <div id="imageLightbox" class="lightbox">
            <button class="lightbox-close" aria-label="Close">&times;</button>

            <img id="lightboxImage" src="" alt="">

            <p id="lightboxCaption"></p>
        </div>
    </main>


 
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .then(registration => {
        console.log("Lydpladsen PWA registered!");
      })
      .catch(error => {
        console.error("PWA registration failed:", error);
      });
  });
}
</script>
 
</body>

</html>
